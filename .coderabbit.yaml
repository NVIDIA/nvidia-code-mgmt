# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Shared OpenBMC review rules live in dgx/bmc/coderabbit and are pulled in
# via inheritance. Only rules unique to nvidia-code-mgmt belong in this file.
language: "en-US"
early_access: false
inheritance: true

reviews:
    path_instructions:
        - path: "**/*.{cpp,hpp,c,h}"
          instructions: |
              ## nvidia-code-mgmt addenda to the inherited OpenBMC rules

              **CG1 – SPDX copyright holder for this repository**
              The copyright line required here is:
              `// SPDX-FileCopyrightText: Copyright (c) YYYY NVIDIA CORPORATION & AFFILIATES. All rights reserved.`
              where YYYY is the year the file was created. Do not flag the
              NVIDIA copyright format as incorrect — it is the required
              format for this repository.

chat:
    auto_reply: true
